{% extends "admin/base.html" %}

{% block extrastyle %}
<style>
  /* Move filters to the left side */
  #changelist-filter {
    position: static;
    float: left;
    width: 200px;
    margin-right: 20px;
    margin-left: 0;
  }
  
  #changelist {
    display: flex;
    flex-direction: row;
  }
  
  #changelist-form {
    flex: 1;
    order: 2;
  }
  
  #changelist-filter {
    order: 1;
  }
  
  /* Adjust the results section */
  #changelist .results {
    margin-right: 0;
  }
  
  /* Make the filter sidebar look better on left */
  #changelist-filter h2 {
    background: #417690;
    color: white;
    padding: 8px 12px;
    font-size: 14px;
    margin: 0;
    border-radius: 4px 4px 0 0;
  }
  
  #changelist-filter ul {
    background: white;
    border: 1px solid #e8e8e8;
    border-top: none;
    padding: 10px;
    margin: 0 0 15px 0;
    border-radius: 0 0 4px 4px;
  }
  
  /* Responsive: stack on mobile */
  @media (max-width: 1024px) {
    #changelist {
      flex-direction: column;
    }
    
    #changelist-filter {
      width: 100%;
      margin-right: 0;
      margin-bottom: 20px;
    }
  }
</style>
{{ block.super }}
{% endblock %}

{% block nav-global %}{% endblock %}
